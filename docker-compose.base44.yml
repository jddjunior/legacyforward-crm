services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: legacyforward
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    image: node:22
    working_dir: /app
    volumes:
      - ./:/app
      - lf_node_modules:/app/node_modules
      - lf_next:/app/.next
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/legacyforward
      - REDIS_URL=redis://redis:6379
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npm install && npx prisma generate && npx prisma db push && npx tsx prisma/seed.ts && npm run dev"

volumes:
  pgdata:
  lf_node_modules:
  lf_next:
