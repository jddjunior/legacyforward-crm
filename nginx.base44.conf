server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Allow any host (preview proxy uses dynamic hostnames)
    add_header Access-Control-Allow-Origin *;

    location / {
        try_files $uri $uri/ =404;
    }

    # Serve .dc.html files with text/html
    location ~ \.dc\.html$ {
        default_type text/html;
    }
}
