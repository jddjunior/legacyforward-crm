name: Tenant isolation

# Build Plan §5: the two-tenant isolation suite runs in CI on every change,
# not only at Phase 0.

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  isolation:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: legacyforward
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/legacyforward
      APP_DATABASE_URL: postgresql://app_user:app_user_ci@localhost:5432/legacyforward
      APP_DB_PASSWORD: app_user_ci

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - name: Apply migrations (creates RLS policies and app_user)
        run: npx prisma migrate deploy
      - name: Grant app_user login
        run: npx tsx prisma/bootstrap-app-role.ts

      - name: Two-tenant isolation suite
        run: npm run test:isolation

      - name: Typecheck
        run: npx tsc --noEmit
